name: Test deployment

on:
  pull_request:
    branches:
      - main

jobs:
  test-slownika:
    name: Walidacja słownika
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Instalacja zależności
        run: npm ci
        working-directory: documentation
      - name: Walidacja słownika
        run: npm run validate:glossary
        working-directory: documentation

  test-deploy:
    name: Test budowania strony
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Instalacja zależności
        run: npm ci
        working-directory: documentation
      - name: Budowanie strony
        run: npm run build
        working-directory: documentation
