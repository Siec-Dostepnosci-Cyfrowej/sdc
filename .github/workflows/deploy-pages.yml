name: Deploy main site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
 
env:
  MERMAID_OUTPUT_DIR: documentation/static/img/diagrams
 
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Siec-Dostepnosci-Cyfrowej'

    outputs:
      diagrams_changed: ${{ steps.diagrams_check.outputs.changed }}
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json
 
      - name: Install dependencies
        run: npm ci
        working-directory: documentation
 
      - name: Build Docusaurus site
        run: npm run build --if-present
        working-directory: documentation
 
      - name: Check if diagrams changed
        id: diagrams_check
        run: |
          if [ -n "$(git status --porcelain ${{ env.MERMAID_OUTPUT_DIR }})" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
 
      - name: Upload diagrams for commit
        if: steps.diagrams_check.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mermaid-diagrams
          path: ${{ env.MERMAID_OUTPUT_DIR }}
 
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: documentation/build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
 
    concurrency:
      group: pages-main
      cancel-in-progress: true
 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    if: github.repository_owner == 'Siec-Dostepnosci-Cyfrowej' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
 
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  commit-diagrams:
    name: Commit pre-rendered diagrams
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.repository_owner == 'Siec-Dostepnosci-Cyfrowej' && needs.build.outputs.diagrams_changed == 'true' && needs.deploy.result == 'success'
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 
      - name: Download pre-rendered diagrams
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mermaid-diagrams
          path: ${{ env.MERMAID_OUTPUT_DIR }}
 
      - name: Commit pre-rendered diagrams
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: pre-render Mermaid diagrams [skip ci]"
          file_pattern: ${{ env.MERMAID_OUTPUT_DIR }}/**
 